# Release build: push a tag like v0.3.0 and this builds, tests and (once SignPath is set up) code-signs
# Vexel.exe, then attaches it to a DRAFT GitHub release. Finish on your own machine with
#   scripts/finish-release.sh v0.3.0
# which signs latest.json with the release key (never stored on GitHub) and publishes the release.
# Draft releases are invisible to the auto-updater, so users only get releases you've finished.
#
# Free for public repositories (standard GitHub-hosted runner).
# SignPath (free for open source, https://signpath.org): add repository secret SIGNPATH_API_TOKEN and
# repository variable SIGNPATH_ORGANIZATION_ID; the signing steps are skipped until then. The SignPath project needs
# two artifact configurations: "natives" (a zip of DLLs: sign every *.dll inside) and the default one (Vexel.exe).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.3.0). Builds an artifact only; no release is created.'
        required: true

permissions:
  contents: write   # create the draft release
  actions: read     # SignPath reads the build artifact

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "XS_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building Vexel $V"

      - name: Build tools (MinGW-w64 cross compiler for FFmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential mingw-w64 nasm zip unzip xz-utils pkg-config

      # SDL2/FFmpeg downloads and the minimal FFmpeg build: rebuilt only when the build script changes.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: natives-${{ hashFiles('scripts/build-ffmpeg-windows.sh', 'scripts/build-opus-windows.sh', 'scripts/publish-windows.sh') }}

      - name: Patched SIPSorcery (low-latency input, hooks for Vexel's receive path)
        run: ./scripts/get-sipsorcery.sh

      - name: Minimal FFmpeg (H.264 + Opus, LGPL)
        run: ls .cache/win-x64/ffmpeg-min/bin/avcodec-*.dll >/dev/null 2>&1 || ./scripts/build-ffmpeg-windows.sh

      - name: libopus (game audio decoder, BSD)
        run: ls .cache/win-x64/opus/opus.dll >/dev/null 2>&1 || ./scripts/build-opus-windows.sh

      - name: Tests
        run: dotnet run --project tests/XStream.Tests -c Release

      # Smart App Control (Windows 11) won't load unsigned DLLs, so the third-party DLLs Vexel ships (SDL2, FFmpeg,
      # Avalonia's ANGLE) are signed BEFORE they're packed into the exe, then the exe itself is signed.
      - name: Gather native DLLs
        env:
          XS_REQUIRE_MIN_FFMPEG: '1'
          XS_REQUIRE_OPUS: '1'
        run: ./scripts/prepare-natives.sh dist/natives

      - name: Upload native DLLs for signing
        id: natives
        uses: actions/upload-artifact@v4
        with:
          name: Vexel-${{ env.XS_VERSION }}-natives-unsigned
          path: dist/natives/*.dll
          if-no-files-found: error

      - name: Code-sign native DLLs with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: xstream
          signing-policy-slug: release-signing
          artifact-configuration-slug: natives
          github-artifact-id: ${{ steps.natives.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/natives-signed

      - name: Build Vexel.exe
        env:
          XS_REQUIRE_MIN_FFMPEG: '1'   # fail instead of quietly shipping the 100 MB general-purpose FFmpeg
        run: |
          if [ -d dist/natives-signed ]; then export XS_NATIVES_DIR=dist/natives-signed; else export XS_NATIVES_DIR=dist/natives; fi
          ./scripts/publish-windows.sh

      - name: Upload unsigned build
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Vexel-${{ env.XS_VERSION }}-unsigned
          path: dist/Vexel.exe
          if-no-files-found: error

      - name: Code-sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: xstream
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: cp signed/Vexel.exe dist/Vexel.exe

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: Vexel-${{ env.XS_VERSION }}
          path: dist/Vexel.exe

      - name: Draft GitHub release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Vexel.exe --draft --generate-notes --title "Vexel $XS_VERSION" \
            --notes "Download **Vexel.exe** below and run it (Windows 10/11, x64). Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          echo "Draft release created. Finish it with: scripts/finish-release.sh $GITHUB_REF_NAME"

  # Apple Silicon Macs: Vexel.app in Vexel-mac.zip, added to the same draft release. Ad-hoc signed, not notarized
  # (that needs a paid Apple Developer ID): the first launch is right-click > Open. macOS doesn't self-update yet;
  # the app links to the release page when there's a new version.
  mac:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "XS_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: .cache/mac
          key: mac-natives-${{ hashFiles('scripts/publish-macos.sh') }}

      - name: libopus
        run: brew install opus

      - name: Patched SIPSorcery
        run: ./scripts/get-sipsorcery.sh

      - name: Build Vexel.app
        run: ./scripts/publish-macos.sh

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Vexel-${{ env.XS_VERSION }}-mac
          path: dist/Vexel-mac.zip
          if-no-files-found: error

      - name: Add to the draft release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Vexel-mac.zip --clobber
